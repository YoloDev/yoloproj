name: Update packages
on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      models: read
    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.DEPS_BOT_APP_ID }}
          private-key: ${{ secrets.DEPS_BOT_APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Nix
        uses: DeterminateSystems/determinate-nix-action@1361e7900eb437fb341f0f226e8fbd9a0d8284fa # v3.17.2
        with:
          extra-conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Set up Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Run update script
        run: nix run .#update-packages --accept-flake-config

      - name: Check the flake
        run: nix flake check --accept-flake-config

      - name: Generate PR title
        id: pr-title
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          DIFF=$(git diff --stat HEAD)
          if [ -z "$DIFF" ]; then
            echo "title=Update packages" >> "$GITHUB_OUTPUT"
          else
            PAYLOAD=$(jq -n --arg diff "$DIFF" '{
              model: "gpt-4o-mini",
              messages: [{
                role: "user",
                content: ("Summarize the following package file changes as a concise GitHub PR title. Start the title with \"Update\". Output only the title, no quotes, no punctuation at the end, max 72 characters.\n\n" + $diff)
              }]
            }')
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              https://models.inference.ai.azure.com/chat/completions \
              -d "$PAYLOAD")
            ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
            if [ -n "$ERROR" ]; then
              echo "GitHub Models API error: $ERROR" >&2
            fi
            TITLE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' | cut -c1-72 | sed 's/[[:punct:]]*$//')
            if [ -z "$TITLE" ]; then
              echo "title=Update packages" >> "$GITHUB_OUTPUT"
            else
              echo "title=$TITLE" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Create PR if there are changes
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Update packages"
          title: ${{ steps.pr-title.outputs.title }}
          body: "This PR updates the package versions and hashes."
          branch: ci/update-packages
          labels: automerge
