name: Update packages
on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      models: read
    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: app-token
        with:
          app-id: ${{ vars.DEPS_BOT_APP_ID }}
          private-key: ${{ secrets.DEPS_BOT_APP_KEY }}

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Nix
        uses: DeterminateSystems/determinate-nix-action@32cb6a5ae30bb0dfc996fa7baf8bf1ed28442fa4 # v3.17.3
        with:
          extra-conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Set up Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Run update script
        run: nix run .#update-packages --accept-flake-config

      - name: Check the flake
        run: nix flake check --accept-flake-config

      - name: Generate PR title
        id: pr-title
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          result-encoding: string
          script: |
            const { execSync } = require('child_process');
            const diff = execSync('git diff --stat HEAD').toString().trim();
            if (!diff) {
              return 'Update packages';
            }
            const prompt =
              'Summarize the following package file changes as a concise GitHub PR title. Focus on version changes. Example, "Update xxx to version yyy, and zzz to version aaa".' +
              'Do not ascribe intent to the changes. Start the title with "Update". Output only the title, no quotes, no punctuation at the end, max 72 characters.\n\n' +
              diff;
            const response = await fetch('https://models.inference.ai.azure.com/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [{ role: 'user', content: prompt }],
              }),
            });
            const data = await response.json();
            const error = data?.error?.message;
            if (error) {
              core.error(`GitHub Models API error: ${error}`);
              return 'Update packages';
            }
            const title = (data?.choices?.[0]?.message?.content ?? '').trim().slice(0, 72).replace(/[.!?;,]+$/, '');
            return title || 'Update packages';

      - name: Create PR if there are changes
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "Update packages"
          title: ${{ steps.pr-title.outputs.result }}
          body: "This PR updates the package versions and hashes."
          branch: ci/update-packages
          labels: automerge
